<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="个人导航站：收藏的 AI 渠道、运维面板、项目工具统一检索。"
    />
    <title>一流导航 | 收藏夹</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23c96f2c'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-size='28' font-family='Arial' font-weight='700' fill='%23fff7e7'%3E航%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="nav.css" />
  </head>
  <body>
    <div id="lockScreen" class="lock-screen" aria-label="访问密码">
      <div class="lock-card">
        <div class="lock-mark">流</div>
        <h1>一流导航</h1>
        <p>私人导航站 · 输入访问密码解锁</p>
        <input
          id="lockPassword"
          type="password"
          placeholder="访问密码"
          autocomplete="current-password"
          spellcheck="false"
        />
        <button id="lockSubmit" class="dark-button" type="button">解锁</button>
        <p id="lockError" class="lock-error"></p>
      </div>
    </div>

    <div class="nav-shell">
      <header class="nav-topbar">
        <a class="brand" href="index.html" aria-label="返回首页">
          <span class="brand-mark">—</span>
          <span>
            <strong>一流导航</strong>
            <small>收藏夹 · AI 渠道 / 运维面板 / 项目工具</small>
          </span>
        </a>
        <div class="nav-search-wrap">
          <span class="nav-search-icon">⌕</span>
          <input id="navSearch" type="search" placeholder="搜索标题或网址，例如 newapi / 宝塔 / github..." autocomplete="off" spellcheck="false" />
          <span id="navCount" class="ghost-chip">0</span>
        </div>
        <div class="nav-actions">
          <span id="syncStatus" class="status-pill is-idle">本地存储</span>
          <button id="addButton" class="dark-button" type="button">+ 添加</button>
          <button id="backHome" class="ghost-button small" type="button">← 首页</button>
        </div>
      </header>

      <main class="nav-layout">
        <aside class="nav-side">
          <div id="groupList" class="group-list"></div>
          <div class="nav-foot-note">
            <p>数据存于本地浏览器，与 Chrome 书签互不干扰。</p>
            <p id="dataInfo"></p>
          </div>
        </aside>

        <section class="nav-main">
          <div id="linkGrid" class="nav-grid"></div>
          <div id="emptyState" class="nav-empty hidden">
            <p>没有匹配的链接。</p>
          </div>
        </section>
      </main>
    </div>

    <div id="addPanel" class="add-panel hidden" aria-label="添加书签">
      <form id="addForm" class="add-card panel-card">
        <div class="widget-head">
          <div><p class="eyebrow">New bookmark</p><h2>添加收藏</h2></div>
          <button type="button" id="addClose" class="ghost-button small">Close</button>
        </div>
        <label><span>名称</span><input id="addName" type="text" placeholder="New API" required /></label>
        <label><span>网址</span><input id="addUrl" type="url" placeholder="https://..." required /></label>
        <label><span>分组</span><input id="addGroup" type="text" placeholder="工具（不填归入「常用」）" list="groupOptions" /></label>
        <datalist id="groupOptions"></datalist>
        <div class="split-row">
          <button type="submit" class="dark-button">保存</button>
          <button type="button" id="addCancel" class="ghost-button">取消</button>
        </div>
      </form>
    </div>

    <script src="auth.js?v=1.0"></script>
    <script src="bookmarks-data.js?v=20260802"></script>
    <script src="nav.js?v=1.0" defer></script>
  </body>
</html>
