<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="一个 Claude Code 风格的个人浏览器首页，用于搜索、快捷入口、待办、便签和信息源管理，数据保存在数据库。"
    />
    <title>一流工作台 | 浏览器首页</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23c96f2c'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-size='28' font-family='Arial' font-weight='700' fill='%23fff7e7'%3E流%3C/text%3E%3C/svg%3E"
    />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#c96f2c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="一流工作台" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/styles.css?v=13" />
  </head>
  <body>
    <!-- 锁屏（认证前仅显示此层） -->
    <div id="lockScreen" class="lock-screen" role="dialog" aria-label="访问密码">
      <div class="lock-card">
        <div class="lock-mark">流</div>
        <h1>一流工作台</h1>
        <p>请输入访问密码以继续</p>
        <input
          id="lockPassword"
          type="password"
          placeholder="访问密码"
          autocomplete="current-password"
          aria-label="访问密码"
        />
        <button id="lockSubmit" class="dark-button" type="button">解锁</button>
        <div id="lockError" class="lock-error" role="alert"></div>
        <p class="lock-hint">数据存储于云端数据库</p>
      </div>
    </div>

    <!-- 业务壳（认证通过后显示） -->
    <div id="appShell">
      <!-- 浏览器框架 -->
      <div class="browser-frame" aria-hidden="true">
        <div class="window-controls"><span></span><span></span><span></span></div>
        <div class="address-bar">https://home.duyiliu.top · V2 架构 · 云端数据库</div>
      </div>

      <!-- 顶栏导航 -->
      <header class="topbar">
        <a class="brand" href="/" data-link aria-label="返回首页">
          <span class="brand-mark">—</span>
          <span>
            <strong>一流工作台</strong>
            <small>V2 · 模块化 · 组件化 · 单页应用</small>
          </span>
        </a>
        <div class="topbar-actions">
          <span id="dateLabel" class="ghost-chip">--</span>
          <span id="weekdayLabel" class="ghost-chip">--</span>
          <span id="clockLabel" class="clock-pill">--:--</span>
          <span class="ghost-chip">⌘ K 快捷命令</span>
          <span id="syncStatus" class="status-pill is-idle">V2 云端同步</span>
        </div>
      </header>

      <!-- 应用容器 -->
      <div id="app"></div>

      <!-- 页脚 -->
      <footer class="app-footer">
        <span>V2 架构：模块化、组件化、单页应用。数据存于云端数据库。</span>
        <span>Claude warm minimal / V2.0.0</span>
      </footer>
    </div>

    <!-- 应用入口（ES Module，统一管理认证 UI 与启动流程） -->
    <script type="module" src="/src/app.js?v=13"></script>

    <!-- 时钟脚本 -->
    <script>
      function renderClock() {
        const now = new Date();
        const clock = new Intl.DateTimeFormat("zh-CN", {
          hour: "2-digit",
          minute: "2-digit",
        }).format(now);
        const weekday = new Intl.DateTimeFormat("zh-CN", {
          weekday: "long",
        }).format(now);
        const date = new Intl.DateTimeFormat("zh-CN", {
          year: "numeric",
          month: "long",
          day: "numeric",
        }).format(now);

        const clockLabel = document.getElementById("clockLabel");
        const weekdayLabel = document.getElementById("weekdayLabel");
        const dateLabel = document.getElementById("dateLabel");

        if (clockLabel) clockLabel.textContent = clock;
        if (weekdayLabel) weekdayLabel.textContent = weekday;
        if (dateLabel) dateLabel.textContent = date;
      }

      renderClock();
      setInterval(renderClock, 1000);
    </script>

    <!-- Service Worker 注册 -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(function (err) {
          console.error('SW 注册失败', err);
        });
      }
    </script>
  </body>
</html>
